<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08182E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Striking CRM">
<meta name="robots" content="noindex,nofollow">
<title>Striking Details &mdash; Book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="icon" href="icon-512.png" sizes="512x512">
<style>
:root{--ink:#08182E;--navy:#0E2745;--navy2:#12314F;--card:#0A1B31;--gold:#C5A253;--gold-lt:#EBD9A5;
 --bone:#F4F1E8;--dim:#8FA0B2;--hair:rgba(197,162,83,.30);--ok:#5FBF8F;--warn:#E0A75E;--bad:#E07A6B;
 --r:12px;--rs:8px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
 font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* lock */
#lock{position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:28px;text-align:center}
#lock h1{font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 4px;font-weight:700}
#lock .sub{color:var(--dim);font-size:13.5px;margin-bottom:26px;max-width:320px}
#lock input{width:100%;max-width:280px;text-align:center;font-size:26px;letter-spacing:.35em;
 background:var(--card);border:1px solid var(--hair);border-radius:var(--rs);padding:14px;margin-bottom:12px}
#lock .err{color:var(--bad);font-size:13px;min-height:20px}
.bolt{width:26px;height:60px;margin-bottom:16px}
/* shell */
#app{display:flex;flex-direction:column;height:100%}
header.bar{position:sticky;top:0;z-index:40;background:rgba(8,24,46,.96);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--hair);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
 display:flex;align-items:center;gap:10px}
header.bar h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em;flex:1}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(96px + var(--safe))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(8,24,46,.97);
 backdrop-filter:blur(10px);border-top:1px solid var(--hair);padding-bottom:var(--safe)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 8px;color:var(--dim);font-size:10.5px;
 letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--gold)}
/* bits */
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:14px;margin-bottom:11px}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:var(--rs);padding:13px 18px;font-weight:700;
 font-size:14.5px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--gold);font-weight:600}
.btn.sm{padding:9px 13px;font-size:13px;width:auto}
.btn.bad{background:transparent;border:1px solid rgba(224,122,107,.5);color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{
 width:100%;background:#0B1E38;border:1px solid var(--hair);border-radius:var(--rs);padding:12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:#0B1E38;border:1px solid var(--hair);border-radius:999px;padding:8px 13px;font-size:12.5px;cursor:pointer;color:var(--dim)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.pill{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;
 background:rgba(197,162,83,.16);color:var(--gold-lt);white-space:nowrap}
.pill.ok{background:rgba(95,191,143,.16);color:var(--ok)}
.pill.warn{background:rgba(224,167,94,.16);color:var(--warn)}
.pill.bad{background:rgba(224,122,107,.16);color:var(--bad)}
.muted{color:var(--dim);font-size:13px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.kpi .card{margin:0;padding:13px}
.kpi .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kpi .val{font-size:24px;font-weight:700;color:var(--gold-lt);margin-top:3px;line-height:1.1}
.kpi .val.sm{font-size:19px}
.item{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.item:last-child{border-bottom:0}
.item .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,#1B3A5C,#0B1E38);
 border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold-lt);flex:0 0 auto;font-size:14px}
.item .bd{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:15px}
.item .sub{font-size:12.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .rt{text-align:right;flex:0 0 auto;font-size:12.5px}
h3.sec{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:20px 0 9px}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:28px 14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.acts.three{grid-template-columns:1fr 1fr 1fr}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
 background:linear-gradient(160deg,rgba(197,162,83,.18),rgba(18,49,79,.55) 60%,rgba(10,27,49,.9));
 border:1px solid var(--gold);border-radius:var(--r);padding:16px 8px;cursor:pointer;
 color:var(--gold-lt);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-align:center;line-height:1.25}
.act:active{transform:scale(.98)}
.act svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.act.plain{background:linear-gradient(160deg,rgba(18,49,79,.6),rgba(10,27,49,.9));border-color:var(--hair);color:var(--gold)}
.fab{position:fixed;right:16px;bottom:calc(74px + var(--safe));z-index:45;width:56px;height:56px;border-radius:50%;
 background:var(--gold);color:var(--ink);border:0;font-size:30px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer}
/* sheet */
.sheet{position:fixed;inset:0;z-index:120;background:rgba(4,12,24,.7);display:none}
.sheet.on{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--ink);display:flex;flex-direction:column}
.sheet .top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
 border-bottom:1px solid var(--hair)}
.sheet .top h3{flex:1;margin:0;font-size:16px;font-weight:700}
.sheet .bd{flex:1;overflow-y:auto;padding:14px 14px calc(20px + var(--safe))}
.x{background:transparent;border:1px solid var(--hair);color:var(--gold);border-radius:var(--rs);padding:7px 12px;font-size:16px;cursor:pointer}
.thumb{width:100%;max-height:190px;object-fit:contain;border:1px solid var(--hair);border-radius:var(--rs);background:#0B1E38;margin-bottom:9px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe));z-index:300;
 background:var(--gold);color:var(--ink);padding:11px 18px;border-radius:999px;font-weight:700;font-size:13.5px;
 opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.warnbox{border-left:3px solid var(--warn);background:rgba(224,167,94,.1);padding:11px 13px;border-radius:0 var(--rs) var(--rs) 0;font-size:13px;color:var(--dim);margin-bottom:11px}
.warnbox b{color:var(--warn)}
.rec{display:flex;align-items:center;gap:10px}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--bad);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
</style>
</head>
<body>

<div id="lock">
  <svg class="bolt" viewBox="0 0 20 48" aria-hidden="true"><defs><linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F0DDA8"/><stop offset="100%" stop-color="#A2803A"/></linearGradient></defs><path d="M15,2 L4,22 L10,22 L3,46 L17,20 L10,20 Z" fill="url(#lb)"/></svg>
  <h1>Striking Details</h1>
  <div class="sub" id="lockSub">Enter your passcode</div>
  <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="••••••">
  <input type="password" id="pw2" class="hide" inputmode="numeric" placeholder="Confirm">
  <div class="err" id="lockErr"></div>
  <button class="btn" id="lockGo" style="max-width:280px">Unlock</button>
</div>

<div id="app" class="hide">
  <header class="bar"><h2 id="ttl">Today</h2><button class="x" id="quickAdd">+</button></header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 10h18M7 3v4M17 3v4"/><rect x="3" y="5" width="18" height="16" rx="2"/></svg>Today</button>
    <button data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 20c0-2.4-1-4.5-2.6-5.7"/></svg>People</button>
    <button data-tab="money"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.6 7 6.5s2 2.8 5 3.5 5 1.6 5 3.5-2.2 3-5 3-5-1.1-5-3"/></svg>Money</button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="in">
  <div class="top"><h3 id="shTtl">Edit</h3><button class="x" id="shX">&#10005;</button></div>
  <div class="bd" id="shBd"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ============================ constants ============================ */
var CATS=['Dealer lot','Residential','Business fleet','Marine','RV / coach','Referral partner'];
var STATUS=['New','Contacted','Quoted','Booked','Completed','Follow up','Dormant'];
var WEIGHT={'New':.1,'Contacted':.2,'Quoted':.4,'Booked':.9,'Follow up':.25,'Completed':0,'Dormant':0};
var SOURCES=['Met in person','Lot','Neighborhood','Referral','Website','Google','Repeat customer','Other'];
var EXPCATS=['Consumables','Marketing','Fuel','Insurance','Software','Fees','Supplies','Other'];
var VTYPES=['Car','Truck / SUV','Boat','RV / coach','Fleet vehicle'];
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s));};
function money(n){return '$'+(Math.round(n||0)).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'x'+Math.abs(Math.floor(performance.now()*1000)).toString(36)+Math.abs((crypto.getRandomValues(new Uint32Array(1))[0])).toString(36);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return '';var p=s.split('-');return p[1]+'/'+p[2]+'/'+p[0].slice(2);}
function daysTo(s){if(!s)return null;var a=new Date(s+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/86400000);}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2000);}

/* ============================ crypto + storage ============================ */
var KEY=null, DB=null, SALT=null, PENDING=null;
(function(){
  try{
    var m=(location.hash||'').match(/[#&]load=([^&]+)/);
    if(!m)return;
    var json=decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))));
    var d=JSON.parse(json);
    if(d&&d.contacts&&d.ledger)PENDING=d;
  }catch(e){}
  // strip it from the address bar either way, so it is not left lying around
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
})();
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('sdcrm',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function kvGet(k){return idb().then(function(db){return new Promise(function(res,rej){
  var t=db.transaction('kv','readonly').objectStore('kv').get(k);
  t.onsuccess=function(){res(t.result);};t.onerror=function(){rej(t.error);};});});}
function kvSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){
  var t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);
  t.onsuccess=function(){res();};t.onerror=function(){rej(t.error);};});});}
function deriveKey(pw,salt){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});
}
function encrypt(obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var data=new TextEncoder().encode(JSON.stringify(obj));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,data).then(function(ct){
    return {iv:Array.from(iv),ct:Array.from(new Uint8Array(ct))};});
}
function decrypt(pack){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(pack.iv)},KEY,new Uint8Array(pack.ct))
    .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){
  DB.updated=new Date().toISOString();
  encrypt(DB).then(function(p){return kvSet('vault',p);}).catch(function(e){toast('Save failed');console.error(e);});
},250);}
function loadFromLink(str){
  try{
    var m=String(str||'').match(/load=([A-Za-z0-9_\-]+)/);
    var b=m?m[1]:String(str||'').trim();
    b=b.replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4)b+='=';
    var d=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!d||!d.contacts||!d.ledger)throw 0;
    return d;
  }catch(e){return null;}
}
function seed(){
  return {v:1,created:new Date().toISOString(),contacts:[],ledger:[]};
}

/* ============================ lock screen ============================ */
function initLock(){
  kvGet('salt').then(function(s){
    if(!s){
      SALT=null;
      $('#lockSub').textContent='Create a passcode. It encrypts everything on this phone. There is no way to recover it, so write it down somewhere safe.';
      $('#pw').placeholder='New passcode'; $('#pw2').classList.remove('hide'); $('#lockGo').textContent='Create';
    } else { SALT=new Uint8Array(s); }
  });
  $('#lockGo').onclick=doUnlock;
  $('#pw2').addEventListener('keydown',function(e){if(e.key==='Enter')doUnlock();});
  $('#pw').addEventListener('keydown',function(e){if(e.key==='Enter'){if($('#pw2').classList.contains('hide'))doUnlock();else $('#pw2').focus();}});
}
function doUnlock(){
  var pw=$('#pw').value, err=$('#lockErr');
  if(pw.length<4){err.textContent='At least 4 characters';return;}
  if(!SALT){
    if(pw!==$('#pw2').value){err.textContent='Those do not match';return;}
    var salt=crypto.getRandomValues(new Uint8Array(16));
    deriveKey(pw,salt).then(function(k){KEY=k;SALT=salt;DB=seed();
      return kvSet('salt',Array.from(salt)).then(function(){return encrypt(DB);})
        .then(function(p){return kvSet('vault',p);});
    }).then(start).catch(function(e){err.textContent='Could not create';console.error(e);});
  } else {
    err.textContent='Checking…';
    deriveKey(pw,SALT).then(function(k){KEY=k;return kvGet('vault');})
      .then(function(p){if(!p){DB=seed();return;} return decrypt(p).then(function(d){DB=d;});})
      .then(start)
      .catch(function(){err.textContent='Wrong passcode';KEY=null;});
  }
}
function start(){
  $('#lock').classList.add('hide'); $('#app').classList.remove('hide');
  $('#pw').value='';$('#pw2').value='';$('#lockErr').textContent='';
  if(PENDING){
    var had=(C().length||L().length);
    var msg=had
      ? 'This setup link carries '+PENDING.contacts.length+' contact(s) and '+PENDING.ledger.length+' ledger entries.\n\nThis phone already has data. Replace it?'
      : 'Load the starting data from this link? '+PENDING.contacts.length+' contact(s) and '+PENDING.ledger.length+' ledger entries.';
    if(confirm(msg)){DB=PENDING;save();toast('Loaded');}
    PENDING=null;
  }
  render();
}

/* ============================ money math ============================ */
function L(){return DB.ledger||[];}
function C(){return DB.contacts||[];}
function sum(a){return a.reduce(function(t,x){return t+(+x.amount||0);},0);}
function cashIn(){return sum(L().filter(function(e){return e.kind==='capital'||(e.kind==='revenue'&&e.paid);}));}
function cashOut(){return sum(L().filter(function(e){return (e.kind==='expense'||e.kind==='equipment')&&e.paid!==false;}));}
function cash(){return cashIn()-cashOut();}
function owed(){return sum(L().filter(function(e){return e.kind==='revenue'&&!e.paid;}));}
function revAll(){return sum(L().filter(function(e){return e.kind==='revenue';}));}
function inMonth(d){return (d||'').slice(0,7)===today().slice(0,7);}
function revMTD(){return sum(L().filter(function(e){return e.kind==='revenue'&&inMonth(e.date);}));}
function expMTD(){return sum(L().filter(function(e){return e.kind==='expense'&&inMonth(e.date);}));}
function opEx(){return sum(L().filter(function(e){return e.kind==='expense';}));}
function equip(){return sum(L().filter(function(e){return e.kind==='equipment';}));}
function capital(){return sum(L().filter(function(e){return e.kind==='capital';}));}
function profit(){return revAll()-opEx();}
function forecast(){var t=0;C().forEach(function(c){
  if(c.quoteAmount>0&&c.status!=='Completed'&&c.status!=='Dormant')t+=c.quoteAmount*(WEIGHT[c.status]||0);});return t;}
function pipeline(){var t=0;C().forEach(function(c){
  if(c.quoteAmount>0&&c.status!=='Completed'&&c.status!=='Dormant')t+=c.quoteAmount;});return t;}
function mrr(){var t=0;C().forEach(function(c){if(c.planAmount>0&&c.status!=='Dormant')t+=+c.planAmount;});return t;}

/* ============================ views ============================ */
var TAB='today';
function render(){
  $$('nav.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===TAB);});
  $('#ttl').textContent={today:'Today',people:'People',money:'Money',more:'More'}[TAB];
  $('#quickAdd').classList.toggle('hide',TAB==='more');
  $('#view').innerHTML=({today:vToday,people:vPeople,money:vMoney,more:vMore})[TAB]();
  $('#view').scrollTop=0;
}
var IC={
 person:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6.4 7-6.4s7 2.8 7 6.4"/></svg>',
 card:'<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M6 10h5M6 13.5h3M15.5 10.5h3M15.5 14h3"/></svg>',
 cash:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg>',
 receipt:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-1.8-3 1.8-3-1.8L6 21z"/><path d="M9.5 8h5M9.5 11.5h5"/></svg>',
 money:'<svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M16.5 7C16.5 5.3 14.5 4.3 12 4.3S7.5 5.3 7.5 7s1.8 2.5 4.5 3.1 4.5 1.4 4.5 3.1-2 2.7-4.5 2.7-4.5-1-4.5-2.7"/></svg>'};
function acts(list,three){
  return '<div class="acts'+(three?' three':'')+'">'+list.map(function(a){
    return '<button class="act'+(a[3]?' plain':'')+'" id="'+a[0]+'">'+IC[a[2]]+'<span>'+a[1]+'</span></button>';
  }).join('')+'</div>';
}
function vToday(){

function shrink(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(max/img.width,max/img.height,1);
      var cv=document.createElement('canvas');
      cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',q));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej();};
    img.src=url;
  });
}
var REC=null,CHUNKS=[];
function toggleRec(btn,st,onDone){
  if(REC&&REC.state==='recording'){REC.stop();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('No microphone access');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    CHUNKS=[]; REC=new MediaRecorder(stream);
    REC.ondataavailable=function(ev){if(ev.data.size)CHUNKS.push(ev.data);};
    REC.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      var b=new Blob(CHUNKS,{type:REC.mimeType||'audio/webm'});
      var fr=new FileReader(); fr.onload=function(){onDone(fr.result);}; fr.readAsDataURL(b);
      btn.textContent='Re-record'; st.innerHTML='';
    };
    REC.start();
    btn.textContent='Stop';
    st.innerHTML='<span class="recdot"></span> recording…';
    setTimeout(function(){if(REC&&REC.state==='recording')REC.stop();},120000);
  }).catch(function(){toast('Microphone blocked');});
}

/* ============================ export / import ============================ */
function dl(name,text,type){
  var b=new Blob([text],{type:type||'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
function csv(rows){
  return rows.map(function(r){return r.map(function(c){
    c=(c==null?'':String(c)); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n');
}
function stamp(){return today();}

/* ============================ events ============================ */
document.addEventListener('click',function(ev){
  var t=ev.target, el;
  if((el=t.closest('nav.tabs button'))){TAB=el.dataset.tab;render();return;}
  if(t.id==='shX'){closeSheet();return;}
  if(t.id==='aPerson'){openSheet('New person',contactForm(null));return;}
  if(t.id==='aCard'){openSheet('New person',contactForm(null));var ci=$('#cardFile');if(ci)ci.click();return;}
  if(t.id==='aExpense'){openSheet('New entry',ledgerForm(null));return;}
  if(t.id==='aReceipt'){openSheet('New entry',ledgerForm(null));var ri=$('#recFile');if(ri)ri.click();return;}
  if(t.id==='aRevenue'){openSheet('Log revenue',ledgerForm(null));
    var k=$('#l_kind [data-v="revenue"]');
    if(k){[].forEach.call(k.parentNode.children,function(x){x.classList.remove('on');});k.classList.add('on');}
    $('#l_cat').value='Job revenue';
    var pd=$('#l_paid'); if(pd&&pd.classList.contains('on'))pd.classList.remove('on');
    return;}
  if(t.id==='quickAdd'){
    if(TAB==='money')openSheet('New entry',ledgerForm(null));
    else openSheet('New person',contactForm(null));
    return;}

  /* chips */
  if((el=t.closest('#c_cat .chip'))||(el=t.closest('#c_status .chip'))||(el=t.closest('#l_kind .chip'))){
    [].forEach.call(el.parentNode.children,function(x){x.classList.remove('on');}); el.classList.add('on'); return;}
  if(t.id==='l_paid'){t.classList.toggle('on');return;}
  if((el=t.closest('[data-cat]'))){FILTER.cat=el.dataset.cat;render();return;}
  if((el=t.closest('[data-st]'))){FILTER.status=el.dataset.st;render();return;}

  /* open records */
  if((el=t.closest('[data-open]'))){var c=findC(el.dataset.open); if(c)openSheet(c.name||'Person',contactView(c)); return;}
  if((el=t.closest('[data-edit]'))){var c2=findC(el.dataset.edit); openSheet('Edit',contactForm(c2)); return;}
  if((el=t.closest('[data-led]'))){var e2=findL(el.dataset.led); if(e2)openSheet('Edit entry',ledgerForm(e2)); return;}
  if((el=t.closest('[data-bill]'))){var pc=el.dataset.bill; var f=ledgerForm(null,pc);
    openSheet('Log revenue',f);
    var k=$('#l_kind [data-v="revenue"]'); if(k){[].forEach.call(k.parentNode.children,function(x){x.classList.remove('on');});k.classList.add('on');}
    $('#l_cat').value='Job revenue'; return;}
  if((el=t.closest('[data-done]'))){var c3=findC(el.dataset.done);
    if(c3){c3.nextStep='';c3.nextDue='';c3.updated=new Date().toISOString();save();closeSheet();render();toast('Marked done');}return;}
  if((el=t.closest('[data-delv]'))){
    var cid=$('#cid').value, cc=findC(cid)||{vehicles:[]};
    var cur=readContactForm(); cur.vehicles.splice(+el.dataset.delv,1); save();
    $('#vlist').innerHTML=vehRows(cur.vehicles); return;}
  if(t.id==='addVeh'){
    var cur2=readContactForm(); cur2.vehicles=cur2.vehicles||[]; cur2.vehicles.push({type:'Car',desc:'',len:''}); save();
    $('#vlist').innerHTML=vehRows(cur2.vehicles); return;}

  /* photos */
  if(t.id==='shotCard'){$('#cardFile').click();return;}
  if(t.id==='delCard'){var c4=readContactForm(); delete c4.card; save(); openSheet('Edit',contactForm(c4)); return;}
  if(t.id==='shotRec'){$('#recFile').click();return;}
  if(t.id==='delRec'){var e4=findL($('#lid').value); if(e4){delete e4.receipt;save();openSheet('Edit entry',ledgerForm(e4));} return;}

  /* record */
  if(t.id==='recBtn'){
    var cc2=readContactForm();
    toggleRec(t,$('#recSt'),function(dataUrl){cc2.memo=dataUrl;save();toast('Voice note saved');});
    return;}

  /* saves */
  if(t.id==='saveC'){
    var c5=readContactForm();
    if(!c5.name){toast('A name is enough, but we need one');return;}
    save(); closeSheet(); render(); toast('Saved'); return;}
  if(t.id==='delC'){
    if(!confirm('Delete this person and their notes?'))return;
    var id=$('#cid').value; DB.contacts=C().filter(function(x){return x.id!==id;});
    save(); closeSheet(); render(); toast('Deleted'); return;}
  if(t.id==='saveL'){
    var id2=$('#lid').value, e5=findL(id2);
    if(!e5){e5={id:id2};DB.ledger.push(e5);}
    var kk=$('#l_kind .chip.on');
    e5.kind=kk?kk.dataset.v:'expense';
    e5.amount=+$('#l_amount').value||0; e5.date=$('#l_date').value||today();
    e5.cat=$('#l_cat').value.trim(); e5.memo=$('#l_memo').value.trim();
    e5.contactId=$('#l_contact').value; e5.hours=+$('#l_hours').value||0;
    e5.paid=$('#l_paid').classList.contains('on');
    if(!e5.amount){toast('Enter an amount');return;}
    save(); closeSheet(); render(); toast('Logged'); return;}
  if(t.id==='delL'){
    if(!confirm('Delete this ledger entry?'))return;
    var id3=$('#lid').value; DB.ledger=L().filter(function(x){return x.id!==id3;});
    save(); closeSheet(); render(); toast('Deleted'); return;}

  /* more tab */
  if(t.id==='expJson'){dl('striking-book-'+stamp()+'.json',JSON.stringify(DB,null,2));toast('Backup saved');return;}
  if(t.id==='expCsvC'){
    var rows=[['Name','Company','Phone','Category','Stage','Source','Met at','Met on','Next step','Next due','Quoted','Plan/mo','Vehicles','Notes']];
    C().forEach(function(c){rows.push([c.name,c.company,c.phone,c.category,c.status,c.source,c.metAt,c.metOn,
      c.nextStep,c.nextDue,c.quoteAmount,c.planAmount,(c.vehicles||[]).map(function(v){return (v.desc||v.type)+(v.len?' '+v.len+'ft':'');}).join('; '),c.notes]);});
    dl('striking-people-'+stamp()+'.csv',csv(rows),'text/csv');toast('CSV saved');return;}
  if(t.id==='expCsvL'){
    var rows2=[['Date','Type','Amount','Category','What','Person','Hours','Paid']];
    L().forEach(function(e){var p=findC(e.contactId);
      rows2.push([e.date,e.kind,e.amount,e.cat,e.memo,p?p.name:'',e.hours||'',e.paid?'yes':'no']);});
    dl('striking-ledger-'+stamp()+'.csv',csv(rows2),'text/csv');toast('CSV saved');return;}
  if(t.id==='impBtn'){$('#impFile').click();return;}
  if(t.id==='pasteBtn'){
    var v=prompt('Paste the setup link you were sent'); if(!v)return;
    var d=loadFromLink(v);
    if(!d){alert('That does not look like a setup link. Copy the whole thing, including the part after the #.');return;}
    if(!confirm('Load '+d.contacts.length+' contact(s) and '+d.ledger.length+' ledger entries? This replaces what is on this phone.'))return;
    DB=d;save();render();toast('Loaded');
    return;}
  if(t.id==='chpw'){
    var a=prompt('New passcode, at least 4 characters'); if(!a||a.length<4)return;
    var b=prompt('Type it again'); if(a!==b){alert('Those did not match');return;}
    var salt=crypto.getRandomValues(new Uint8Array(16));
    deriveKey(a,salt).then(function(k){KEY=k;SALT=salt;return kvSet('salt',Array.from(salt));})
      .then(function(){return encrypt(DB);}).then(function(p){return kvSet('vault',p);})
      .then(function(){toast('Passcode changed');});
    return;}
  if(t.id==='wipe'){
    if(!confirm('Erase all people, ledger and photos on this phone? This cannot be undone.'))return;
    if(!confirm('Really erase everything? Export a backup first if you have not.'))return;
    Promise.all([kvSet('vault',null),kvSet('salt',null)]).then(function(){location.reload();});
    return;}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='cardFile'&&t.files[0]){
    shrink(t.files[0],1100,.7).then(function(d){var c=readContactForm();c.card=d;save();
      openSheet('Edit',contactForm(c));
      toast('Card saved. Fill in what it does not tell you.');});}
  if(t.id==='recFile'&&t.files[0]){
    shrink(t.files[0],1100,.65).then(function(d){
      var id=$('#lid').value,e=findL(id);
      if(!e){e={id:id};DB.ledger.push(e);}
      e.kind=($('#l_kind .chip.on')||{dataset:{v:'expense'}}).dataset.v;
      e.amount=+$('#l_amount').value||0;e.date=$('#l_date').value||today();
      e.cat=$('#l_cat').value.trim();e.memo=$('#l_memo').value.trim();
      e.contactId=$('#l_contact').value;e.paid=$('#l_paid').classList.contains('on');
      e.receipt=d; save(); openSheet('Edit entry',ledgerForm(e)); toast('Receipt saved');});}
  if(t.id==='impFile'&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{var d=JSON.parse(fr.result);
        if(!d.contacts||!d.ledger)throw 0;
        if(!confirm('Replace everything on this phone with this backup?'))return;
        DB=d;save();render();closeSheet();toast('Restored');
      }catch(e){alert('That file is not a Striking backup.');}
    };
    fr.readAsText(t.files[0]);}
  if(t.dataset&&t.dataset.vi!==undefined){
    var c=readContactForm(); var i=+t.dataset.vi;
    c.vehicles[i]=c.vehicles[i]||{}; c.vehicles[i][t.dataset.vf]=t.value; save();}
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
initLock();
