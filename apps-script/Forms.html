<script>
/* =================== sheet =================== */
function openSheet(t,html){$('#shTtl').textContent=t;$('#shBd').innerHTML=html;$('#sheet').classList.add('on');$('#shBd').scrollTop=0;}
function closeSheet(){$('#sheet').classList.remove('on');}

/* =================== contacts =================== */
function contactForm(c){
  var n=!c;
  c=c||{id:uid(),status:'New',category:'',source:'Met in person',metOn:today(),vehicles:''};
  var vs=parseVeh(c.vehicles);
  var h='<input type="hidden" id="cid" value="'+c.id+'">';
  h+='<label class="f"><span>Name</span><input type="text" id="c_name" value="'+esc(c.name)+'" placeholder="A first name is enough" autocapitalize="words"></label>';
  h+='<div class="row2"><label class="f"><span>Mobile</span><input type="tel" id="c_phone" value="'+esc(c.phone)+'" placeholder="(561) 000-0000"></label>'
    +'<label class="f"><span>Company</span><input type="text" id="c_company" value="'+esc(c.company)+'" autocapitalize="words"></label></div>';
  h+='<label class="f"><span>Who are they</span></label><div class="chips" id="c_cat" style="margin:-6px 0 13px">'
    +CATS.map(function(x){return '<span class="chip'+(c.category===x?' on':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</span>';}).join('')+'</div>';
  h+='<label class="f"><span>Stage</span></label><div class="chips" id="c_status" style="margin:-6px 0 13px">'
    +STATUS.map(function(x){return '<span class="chip'+((c.status||'New')===x?' on':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</span>';}).join('')+'</div>';
  h+='<div class="row2"><label class="f"><span>Where met</span><input type="text" id="c_metAt" value="'+esc(c.metAt)+'" placeholder="Marina, lot, street…"></label>'
    +'<label class="f"><span>When</span><input type="date" id="c_metOn" value="'+esc(String(c.metOn||today()).slice(0,10))+'"></label></div>';
  h+='<label class="f"><span>How they found him</span><select id="c_source">'
    +SOURCES.map(function(s){return '<option'+(c.source===s?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select></label>';
  h+='<h3 class="sec">Next step</h3><div class="row2">'
    +'<label class="f"><span>What</span><input type="text" id="c_nextStep" value="'+esc(c.nextStep)+'" placeholder="Call, quote, follow up…"></label>'
    +'<label class="f"><span>By when</span><input type="date" id="c_nextDue" value="'+esc(String(c.nextDue||'').slice(0,10))+'"></label></div>';
  h+='<h3 class="sec">Money</h3><div class="row2">'
    +'<label class="f"><span>Quoted</span><input type="number" inputmode="decimal" id="c_quoteAmount" value="'+(+c.quoteAmount||'')+'" placeholder="0"></label>'
    +'<label class="f"><span>Plan / month</span><input type="number" inputmode="decimal" id="c_planAmount" value="'+(+c.planAmount||'')+'" placeholder="0"></label></div>';
  h+='<h3 class="sec">Vehicles</h3><div id="vlist">'+vehRows(vs)+'</div>'
    +'<button class="btn ghost sm" id="addVeh">+ Add vehicle</button>';
  h+='<h3 class="sec">Notes</h3><label class="f"><textarea id="c_notes" placeholder="Tap the mic on your keyboard to dictate.">'+esc(c.notes)+'</textarea></label>';
  h+='<h3 class="sec">Business card</h3>'
    +(c.cardUrl?'<img class="thumb" src="'+esc(c.cardUrl)+'">':'')
    +'<input type="file" id="cardFile" accept="image/*" capture="environment" class="hide">'
    +'<button class="btn ghost sm" id="shotCard">'+(c.cardUrl?'Replace card photo':'Photograph card')+'</button>';
  h+='<div style="height:20px"></div><button class="btn" id="saveC">Save</button>';
  if(!n)h+='<div style="height:9px"></div><button class="btn bad" id="delC">Delete this person</button>';
  return h;
}
function vehRows(v){
  if(!v.length)return '<div class="muted" style="margin-bottom:9px">None yet.</div>';
  return v.map(function(x,i){
    return '<div class="card" style="padding:11px"><div class="row2">'
     +'<label class="f" style="margin:0"><span>Type</span><select data-vi="'+i+'" data-vf="type">'
     +VTYPES.map(function(t){return '<option'+(x.type===t?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></label>'
     +'<label class="f" style="margin:0"><span>Length ft</span><input type="number" inputmode="numeric" data-vi="'+i+'" data-vf="len" value="'+esc(x.len)+'"></label></div>'
     +'<label class="f" style="margin:9px 0 0"><span>Year, make, model</span><input type="text" data-vi="'+i+'" data-vf="desc" value="'+esc(x.desc)+'" placeholder="2019 Sea Ray"></label>'
     +'<button class="btn ghost sm" data-delv="'+i+'" style="margin-top:9px">Remove</button></div>';
  }).join('');
}
function readContactForm(){
  var id=$('#cid').value, c=findC(id)||{id:id};
  c.name=$('#c_name').value.trim(); c.phone=$('#c_phone').value.trim(); c.company=$('#c_company').value.trim();
  c.metAt=$('#c_metAt').value.trim(); c.metOn=$('#c_metOn').value; c.source=$('#c_source').value;
  c.nextStep=$('#c_nextStep').value.trim(); c.nextDue=$('#c_nextDue').value;
  c.quoteAmount=+$('#c_quoteAmount').value||0; c.planAmount=+$('#c_planAmount').value||0;
  c.notes=$('#c_notes').value;
  var cc=$('#c_cat .chip.on'), cs=$('#c_status .chip.on');
  c.category=cc?cc.dataset.v:''; c.status=cs?cs.dataset.v:'New';
  var vs=[];
  $$('[data-vi]').forEach(function(el){var i=+el.dataset.vi;vs[i]=vs[i]||{};vs[i][el.dataset.vf]=el.value;});
  c.vehicles=joinVeh(vs.filter(Boolean));
  return c;
}
function contactView(c){
  var d=c.nextDue?daysTo(c.nextDue):null, vs=parseVeh(c.vehicles);
  var h='<div class="card"><div style="display:flex;gap:11px;align-items:center">'
   +'<div class="av" style="width:46px;height:46px;font-size:17px">'+esc(String(c.name||'?').charAt(0).toUpperCase())+'</div>'
   +'<div style="flex:1;min-width:0"><div style="font-size:19px;font-weight:700">'+esc(c.name||'Unnamed')+'</div>'
   +'<div class="muted">'+[esc(c.company),esc(c.category)].filter(Boolean).join(' &middot; ')+'</div></div></div>';
  if(c.phone)h+='<div class="row2" style="margin-top:12px">'
   +'<a class="btn ghost" style="text-align:center;text-decoration:none;display:block" href="tel:'+esc(c.phone)+'">Call</a>'
   +'<a class="btn ghost" style="text-align:center;text-decoration:none;display:block" href="sms:'+esc(c.phone)+'">Text</a></div>';
  h+='</div>';
  h+='<div class="card"><div class="row2">'+kv('Stage',esc(c.status||'New'))+kv('Source',esc(c.source||'—'))
   +kv('Quoted',+c.quoteAmount?money(c.quoteAmount):'—')+kv('Plan',+c.planAmount?money(c.planAmount)+'/mo':'—')+'</div></div>';
  if(c.nextStep){
    var cls=d<0?'bad':(d===0?'warn':'ok');
    h+='<div class="card"><div class="lab">Next step</div><div style="font-size:16px;margin:5px 0 7px">'+esc(c.nextStep)+'</div>'
     +'<span class="pill '+cls+'">'+(d<0?Math.abs(d)+' days late':(d===0?'Due today':'Due '+fmtDate(c.nextDue)))+'</span>'
     +'<div style="height:11px"></div><button class="btn ghost sm" data-done="'+c.id+'">Mark done</button></div>';
  }
  if(vs.length)h+='<div class="card"><h3 class="sec" style="margin-top:0">Vehicles</h3>'
   +vs.map(function(v){return '<div class="item" style="cursor:default"><div class="bd"><div class="nm">'+esc(v.desc||v.type)+'</div>'
     +'<div class="sub">'+esc(v.type)+(v.len?' &middot; '+v.len+' ft':'')+'</div></div></div>';}).join('')+'</div>';
  if(c.metAt||c.metOn)h+='<div class="card"><div class="muted">Met '+esc(c.metAt||'')+(c.metOn?' on '+fmtDate(c.metOn):'')+'</div></div>';
  if(c.notes)h+='<div class="card"><h3 class="sec" style="margin-top:0">Notes</h3><div style="white-space:pre-wrap">'+esc(c.notes)+'</div></div>';
  if(c.cardUrl)h+='<div class="card"><h3 class="sec" style="margin-top:0">Business card</h3><img class="thumb" src="'+esc(c.cardUrl)+'"></div>';
  var jobs=L().filter(function(e){return e.contactId===c.id;});
  if(jobs.length)h+='<div class="card"><h3 class="sec" style="margin-top:0">Money</h3>'+jobs.map(ledHTML).join('')+'</div>';
  h+='<div class="row2"><button class="btn" data-edit="'+c.id+'">Edit</button>'
   +'<button class="btn ghost" data-bill="'+c.id+'">Log revenue</button></div>';
  return h;
}

/* =================== ledger =================== */
function ledgerForm(e,preset){
  var n=!e;
  e=e||{id:uid(),date:today(),kind:'expense',cat:'Supplies',paid:true,contactId:preset||''};
  var kinds=[['revenue','Money in, job'],['expense','Money out, running cost'],['equipment','Money out, equipment'],['capital','Owner money in']];
  var h='<input type="hidden" id="lid" value="'+e.id+'">';
  h+='<div class="chips" id="l_kind" style="margin-bottom:13px">'
    +kinds.map(function(k){return '<span class="chip'+(e.kind===k[0]?' on':'')+'" data-v="'+k[0]+'">'+k[1]+'</span>';}).join('')+'</div>';
  h+='<div class="row2"><label class="f"><span>Amount</span><input type="number" inputmode="decimal" id="l_amount" value="'+(+e.amount||'')+'" placeholder="0.00"></label>'
    +'<label class="f"><span>Date</span><input type="date" id="l_date" value="'+esc(String(e.date||today()).slice(0,10))+'"></label></div>';
  h+='<div class="row2"><label class="f"><span>Vehicles done</span><input type="number" inputmode="numeric" id="l_veh" value="'+(+e.vehicles||'')+'" placeholder="1"></label>'
    +'<label class="f"><span>Hours on site</span><input type="number" inputmode="decimal" id="l_hours" value="'+(+e.hours||'')+'" placeholder="6" step="0.5"></label></div>';
  h+='<div class="muted" style="margin:-4px 0 13px">Hours is what turns this into an hourly rate. Round to the nearest half hour, door to door.</div>';
  h+='<label class="f"><span>Category</span><input type="text" id="l_cat" value="'+esc(e.cat)+'" list="catlist">'
    +'<datalist id="catlist">'+EXPCATS.concat(['Job revenue','Equipment','Owner contribution']).map(function(c){return '<option>'+esc(c)+'</option>';}).join('')+'</datalist></label>';
  h+='<label class="f"><span>What was it</span><input type="text" id="l_memo" value="'+esc(e.memo)+'" placeholder="Pads, coating, three cars at the lot…"></label>';
  h+='<label class="f"><span>Linked person</span><select id="l_contact"><option value="">—</option>'
    +C().map(function(c){return '<option value="'+c.id+'"'+(e.contactId===c.id?' selected':'')+'>'+esc(c.name||'Unnamed')+'</option>';}).join('')+'</select></label>';
  h+='<div class="chips" style="margin-bottom:13px"><span class="chip'+(e.paid!==false?' on':'')+'" id="l_paid">Paid / settled</span></div>';
  h+='<h3 class="sec">Receipt</h3>'
    +(e.receiptUrl?'<img class="thumb" src="'+esc(e.receiptUrl)+'">':'')
    +'<input type="file" id="recFile" accept="image/*" capture="environment" class="hide">'
    +'<button class="btn ghost sm" id="shotRec">'+(e.receiptUrl?'Replace receipt':'Photograph receipt')+'</button>';
  h+='<div style="height:20px"></div><button class="btn" id="saveL">Save</button>';
  if(!n)h+='<div style="height:9px"></div><button class="btn bad" id="delL">Delete entry</button>';
  return h;
}
function readLedgerForm(){
  var id=$('#lid').value, e=findL(id)||{id:id};
  var k=$('#l_kind .chip.on');
  e.kind=k?k.dataset.v:'expense';
  e.amount=+$('#l_amount').value||0; e.date=$('#l_date').value||today();
  e.cat=$('#l_cat').value.trim(); e.memo=$('#l_memo').value.trim();
  e.contactId=$('#l_contact').value; e.hours=+$('#l_hours').value||0;
  e.vehicles=+$('#l_veh').value||0; e.paid=$('#l_paid').classList.contains('on');
  return e;
}

/* =================== goal =================== */
function goalForm(){
  var g=goal(), auto=costPctActual();
  return '<label class="f"><span>Take home in a year, after tax</span>'
   +'<input type="number" inputmode="decimal" id="g_target" value="'+(g.target||'')+'" placeholder="60000"></label>'
   +'<div class="row2"><label class="f"><span>Tax set aside %</span><input type="number" inputmode="decimal" id="g_tax" value="'+g.taxPct+'"></label>'
   +'<label class="f"><span>Supplies % of revenue</span><input type="number" inputmode="decimal" id="g_cost" value="'+(g.costPct==null?'':g.costPct)+'" placeholder="'+(auto==null?'20':auto+' from your books')+'"></label></div>'
   +'<div class="muted" style="margin:-4px 0 13px">'+(auto==null
      ?'Leave supplies blank and it assumes 20% until there are five jobs and $2k billed.'
      :'Leave supplies blank and it uses <b>'+auto+'%</b>, from what you have actually spent and billed.')+'</div>'
   +'<div class="row2"><label class="f"><span>Working days a week</span><input type="number" inputmode="numeric" id="g_days" value="'+g.daysPerWeek+'"></label>'
   +'<label class="f"><span>Working weeks a year</span><input type="number" inputmode="numeric" id="g_weeks" value="'+g.weeksPerYear+'"></label></div>'
   +'<div class="warnbox"><b>Planning estimate, not tax advice.</b> Florida has no state income tax, but self-employment tax alone is about 15.3% before federal income tax, so 25 to 30% is a common set-aside. Check the real number with an accountant.</div>'
   +'<button class="btn" id="goalSave">Save</button>';
}

/* =================== invoices =================== */
function invForm(iv){
  var n=!iv;
  iv=iv||{id:uid(),no:nextInvNo(),date:today(),terms:'Due on receipt',itemsJson:JSON.stringify([{vehicle:{},service:'',amount:''}])};
  var items=invItems(iv);
  var h='<input type="hidden" id="iv_id" value="'+iv.id+'">';
  h+='<div class="row2"><label class="f"><span>Invoice no</span><input type="text" id="iv_no" value="'+esc(iv.no)+'"></label>'
    +'<label class="f"><span>Date</span><input type="date" id="iv_date" value="'+esc(String(iv.date||today()).slice(0,10))+'"></label></div>';
  h+='<h3 class="sec" style="margin-top:6px">Bill to</h3>';
  h+='<label class="f"><span>Name</span><input type="text" id="iv_toName" value="'+esc(iv.toName)+'" autocapitalize="words"></label>';
  h+='<div class="row2"><label class="f"><span>Company</span><input type="text" id="iv_toCompany" value="'+esc(iv.toCompany)+'" autocapitalize="words"></label>'
    +'<label class="f"><span>Attn</span><input type="text" id="iv_attn" value="'+esc(iv.attn)+'"></label></div>';
  h+='<div class="row2"><label class="f"><span>Street</span><input type="text" id="iv_toAddr" value="'+esc(iv.toAddr)+'"></label>'
    +'<label class="f"><span>City, state zip</span><input type="text" id="iv_toCity" value="'+esc(iv.toCity)+'"></label></div>';
  h+='<h3 class="sec">Vehicles</h3><div id="ivItems">'+invItemRows(items)+'</div>'
    +'<button class="btn ghost sm" id="ivAdd">+ Add vehicle</button>';
  h+='<h3 class="sec">Work performed</h3><label class="f"><textarea id="iv_notes" placeholder="Reset Wash on three vehicles on the lot.">'+esc(iv.notes)+'</textarea></label>';
  h+='<label class="f"><span>Terms</span><input type="text" id="iv_terms" value="'+esc(iv.terms||'Due on receipt')+'"></label>';
  h+='<div style="height:8px"></div><button class="btn" id="ivPreview">Preview and send</button>';
  h+='<div style="height:9px"></div><button class="btn ghost" id="ivSave">Save draft</button>';
  if(!n)h+='<div style="height:9px"></div><button class="btn bad" id="ivDel">Delete invoice</button>';
  return h;
}
function invItemRows(items){
  if(!items.length)return '<div class="muted" style="margin-bottom:9px">No vehicles yet.</div>';
  return items.map(function(it,i){
    var v=it.vehicle||{};
    return '<div class="card" style="padding:11px"><div class="row3">'
     +'<label class="f" style="margin:0"><span>Year</span><input type="text" inputmode="numeric" data-ii="'+i+'" data-if="year" value="'+esc(v.year)+'" placeholder="2017"></label>'
     +'<label class="f" style="margin:0"><span>Make</span><input type="text" data-ii="'+i+'" data-if="make" value="'+esc(v.make)+'" placeholder="Audi" autocapitalize="words"></label>'
     +'<label class="f" style="margin:0"><span>Model</span><input type="text" data-ii="'+i+'" data-if="model" value="'+esc(v.model)+'" placeholder="Q7" autocapitalize="words"></label></div>'
     +'<div class="row2" style="margin-top:9px"><label class="f" style="margin:0"><span>Colour</span><input type="text" data-ii="'+i+'" data-if="color" value="'+esc(v.color)+'" placeholder="White" autocapitalize="words"></label>'
     +'<label class="f" style="margin:0"><span>Amount</span><input type="number" inputmode="decimal" data-ii="'+i+'" data-ia="amount" value="'+(it.amount||'')+'" placeholder="75"></label></div>'
     +'<label class="f" style="margin:9px 0 0"><span>Service</span><input type="text" data-ii="'+i+'" data-ia="service" value="'+esc(it.service)+'" list="svclist" placeholder="Reset Wash"></label>'
     +'<button class="btn ghost sm" data-delitem="'+i+'" style="margin-top:9px">Remove</button></div>';
  }).join('')+'<datalist id="svclist">'+SERVICES.map(function(x){return '<option>'+esc(x[0])+'</option>';}).join('')+'</datalist>';
}
function readInvForm(){
  var id=$('#iv_id').value, iv=findI(id)||{id:id};
  ['no','date','toName','toCompany','attn','toAddr','toCity','notes','terms'].forEach(function(k){
    var el=$('#iv_'+k); if(el)iv[k]=el.value;});
  iv.serviceDate=iv.date;
  var items=[];
  $$('[data-ii]').forEach(function(el){
    var i=+el.dataset.ii; items[i]=items[i]||{vehicle:{}};
    if(el.dataset.if){items[i].vehicle=items[i].vehicle||{};items[i].vehicle[el.dataset.if]=el.value;}
    if(el.dataset.ia)items[i][el.dataset.ia]=el.dataset.ia==='amount'?(+el.value||0):el.value;
  });
  items=items.filter(Boolean);
  iv.itemsJson=JSON.stringify(items);
  iv.total=items.reduce(function(t,x){return t+(+x.amount||0);},0);
  iv.summary=items.map(function(x){return vehLabel(x.vehicle||{})+' - '+(x.service||'')+' $'+(x.amount||0);}).join(' | ');
  return iv;
}
function invPreview(iv){
  return '<img class="thumb" style="max-height:none" src="'+drawInvoice(iv).toDataURL('image/png')+'">'
   +'<div class="row2" style="margin-top:6px"><button class="btn" id="ivShare">Text or email it</button>'
   +'<button class="btn ghost" id="ivSaveImg">Save image</button></div>'
   +'<div style="height:9px"></div><button class="btn ghost" id="ivBack">Back to edit</button>'
   +'<div class="muted" style="margin-top:11px">Sends as an image, which drops straight into Messages or Mail. For a PDF, save it then use Print from the share sheet.</div>';
}
function drawInvoice(iv){
  var items=invItems(iv);
  var noteLines=Math.max(3,String(iv.notes||'').split('\n').length);
  var W=1240,H=Math.max(980,470+44+items.length*52+300+noteLines*26+120);
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var x=cv.getContext('2d');
  var NAVY='#08182E',GOLD='#C5A253',GOLDL='#B8963F',INKT='#1A2733',MUT='#6B7A88';
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  x.fillStyle=NAVY;x.fillRect(0,0,W,208);
  x.fillStyle=GOLD;x.fillRect(0,208,W,5);
  x.textBaseline='alphabetic';
  x.fillStyle='#F7F1E0';x.font='700 46px Georgia, serif';x.fillText('STRIKING DETAILS',64,104);
  x.fillStyle=GOLD;x.font='600 17px Helvetica, Arial, sans-serif';
  x.fillText('CERAMIC  ·  PPF  ·  HAND WASH  ·  AUTO  ·  MARINE  ·  RV',64,142);
  x.textAlign='right';
  x.fillStyle='#F7F1E0';x.font='700 40px Georgia, serif';x.fillText('INVOICE',W-64,100);
  x.fillStyle=GOLD;x.font='600 22px Helvetica, Arial, sans-serif';x.fillText(iv.no||'',W-64,136);
  x.textAlign='left';
  function head(t,X,Y){x.fillStyle=GOLDL;x.font='700 13px Helvetica, Arial, sans-serif';x.fillText(t.toUpperCase(),X,Y);}
  function line(t,X,Y,sz,col,bold){x.fillStyle=col||INKT;x.font=(bold?'700 ':'')+(sz||17)+'px Helvetica, Arial, sans-serif';x.fillText(t,X,Y);}
  var y=286;
  head('From',64,y);head('Bill to',470,y);head('Details',876,y);y+=30;
  [BIZ.name,BIZ.addr,BIZ.city,BIZ.phone,BIZ.web].forEach(function(t,i){line(t,64,y+i*26,16,i===0?INKT:MUT,i===0);});
  [iv.toName,iv.toCompany,iv.toAddr,iv.toCity,iv.attn?('Attn: '+iv.attn):''].filter(String)
    .forEach(function(t,i){line(t,470,y+i*26,16,i===0?INKT:MUT,i===0);});
  [['Invoice',iv.no||''],['Invoice date',fmtDate(iv.date)],['Service date',fmtDate(iv.serviceDate||iv.date)],
   ['Terms',iv.terms||'Due on receipt'],['Vehicles',String(items.length)]]
    .forEach(function(d,i){line(d[0],876,y+i*26,15,MUT);x.textAlign='right';line(d[1],W-64,y+i*26,15,INKT);x.textAlign='left';});
  y=470;
  x.fillStyle=NAVY;x.fillRect(64,y,W-128,44);
  x.fillStyle='#F7F1E0';x.font='700 14px Helvetica, Arial, sans-serif';
  x.fillText('VEHICLE',82,y+29);x.fillText('SERVICE',560,y+29);
  x.textAlign='right';x.fillText('AMOUNT',W-82,y+29);x.textAlign='left';
  y+=44;
  items.forEach(function(it,i){
    if(i%2){x.fillStyle='#F7F8FA';x.fillRect(64,y,W-128,52);}
    line(vehLabel(it.vehicle||{})||'—',82,y+33,17,INKT);
    line(it.service||'',560,y+33,17,MUT);
    x.textAlign='right';line('$'+(+it.amount||0).toFixed(2),W-82,y+33,18,INKT,true);x.textAlign='left';
    x.strokeStyle='#E4E8EC';x.lineWidth=1;x.beginPath();x.moveTo(64,y+52);x.lineTo(W-64,y+52);x.stroke();
    y+=52;
  });
  y+=26;
  var tot=items.reduce(function(t,z){return t+(+z.amount||0);},0);
  x.textAlign='right';
  line('Subtotal, '+items.length+' vehicle'+(items.length===1?'':'s'),W-240,y,17,MUT);

  x.textAlign='left';

  head('Payment',64,y);head('Work performed',560,y);y+=28;
  ['Payable to '+BIZ.name,iv.terms||'Due on receipt','Questions: '+BIZ.phone]
    .forEach(function(t,i){line(t,64,y+i*26,15,MUT);});
  String(iv.notes||'').split('\n').slice(0,5).forEach(function(t,i){line(t,560,y+i*26,15,MUT);});
  x.fillStyle=NAVY;x.fillRect(0,H-96,W,96);

  x.fillText('CERTIFIED  ·  WARRANTIED  ·  PALM CITY, FL',W/2,H-54);

  return cv;
}

/* =================== photos =================== */
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(max/img.width,max/img.height,1);
      var cv=document.createElement('canvas');
      cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',q));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej();};
    img.src=url;
  });
}

  if(t.id==='saveL'){var e5=readLedgerForm();
    if(!e5.amount){toast('Enter an amount');return;}

/* =================== boot =================== */
function boot(){
  $('#bootMsg').textContent='Opening your book…';
  $('#bootSpin').style.display='';
  $('#bootRetry').style.display='none';
  call('bootstrap').then(function(d){
    DB.contacts=d.contacts||[];DB.ledger=d.ledger||[];DB.invoices=d.invoices||[];DB.settings=d.settings||{};
    USER=d.user||'';
    $('#who').textContent=USER.split('@')[0];
    $('#boot').classList.add('hide');$('#app').classList.remove('hide');
    render();
  }).catch(function(e){
    $('#bootSpin').style.display='none';
    $('#bootMsg').textContent=String(e&&e.message||e);
    $('#bootRetry').style.display='';
  });
}
$('#bootRetry').addEventListener('click',boot);
boot();
