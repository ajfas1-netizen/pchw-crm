<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--ink:#08182E;--navy:#0E2745;--card:#0A1B31;--gold:#C5A253;--gold-lt:#EBD9A5;
 --bone:#F4F1E8;--dim:#8FA0B2;--hair:rgba(197,162,83,.30);--ok:#5FBF8F;--warn:#E0A75E;--bad:#E07A6B;
 --r:12px;--rs:8px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--bone);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* boot */
#boot{position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:30px;text-align:center;gap:14px}
#boot .bolt{width:26px;height:60px}
#boot h1{font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0;font-weight:700}
#boot .msg{color:var(--dim);font-size:14px;max-width:330px}
.spin{width:22px;height:22px;border:2px solid rgba(197,162,83,.25);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* shell */
#app{display:flex;flex-direction:column;height:100%}
header.bar{position:sticky;top:0;z-index:40;background:rgba(8,24,46,.96);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--hair);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
 display:flex;align-items:center;gap:9px}
header.bar h2{margin:0;font-size:17px;font-weight:700;flex:1}
.who{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
 border:1px solid var(--hair);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.sv{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}
.sv.idle{color:var(--dim)}
.sv.busy{color:var(--gold);background:rgba(197,162,83,.12)}
.sv.err{color:var(--bad);background:rgba(224,122,107,.14);cursor:pointer}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(96px + var(--safe))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(8,24,46,.97);
 backdrop-filter:blur(10px);border-top:1px solid var(--hair);padding-bottom:var(--safe)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 8px;color:var(--dim);font-size:10.5px;
 letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--gold)}
/* bits */
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:14px;margin-bottom:11px}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:var(--rs);padding:13px 18px;font-weight:700;font-size:14.5px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--gold);font-weight:600}
.btn.sm{padding:9px 13px;font-size:13px;width:auto}
.btn.bad{background:transparent;border:1px solid rgba(224,122,107,.5);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{
 width:100%;background:#0B1E38;border:1px solid var(--hair);border-radius:var(--rs);padding:12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:#0B1E38;border:1px solid var(--hair);border-radius:999px;padding:8px 13px;font-size:12.5px;cursor:pointer;color:var(--dim)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.pill{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;
 background:rgba(197,162,83,.16);color:var(--gold-lt);white-space:nowrap}
.pill.ok{background:rgba(95,191,143,.16);color:var(--ok)}
.pill.warn{background:rgba(224,167,94,.16);color:var(--warn)}
.pill.bad{background:rgba(224,122,107,.16);color:var(--bad)}
.muted{color:var(--dim);font-size:13px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.kpi .card{margin:0;padding:13px}
.lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.val{font-size:24px;font-weight:700;color:var(--gold-lt);margin-top:3px;line-height:1.1}
.val.sm{font-size:19px}
.item{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.item:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,#1B3A5C,#0B1E38);
 border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold-lt);flex:0 0 auto;font-size:14px}
.bd{flex:1;min-width:0}
.nm{font-weight:600;font-size:15px}
.sub{font-size:12.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{text-align:right;flex:0 0 auto;font-size:12.5px}
h3.sec{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:20px 0 9px}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:26px 14px}
/* quick actions */
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:14px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
 background:linear-gradient(160deg,rgba(197,162,83,.18),rgba(18,49,79,.55) 60%,rgba(10,27,49,.9));
 border:1px solid var(--gold);border-radius:var(--r);padding:14px 6px;cursor:pointer;
 color:var(--gold-lt);font-size:11.5px;font-weight:700;text-align:center;line-height:1.25}
.act:active{transform:scale(.98)}
.act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
.sheet{position:fixed;inset:0;z-index:120;background:rgba(4,12,24,.72);display:none}
.sheet.on{display:block}
.sheet .in{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column}
.sheet .top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;border-bottom:1px solid var(--hair)}
.sheet .top h3{flex:1;margin:0;font-size:16px;font-weight:700}
.sheet .bd2{flex:1;overflow-y:auto;padding:14px 14px calc(24px + var(--safe))}
.x{background:transparent;border:1px solid var(--hair);color:var(--gold);border-radius:var(--rs);padding:7px 12px;font-size:16px;cursor:pointer}
.thumb{width:100%;max-height:200px;object-fit:contain;border:1px solid var(--hair);border-radius:var(--rs);background:#0B1E38;margin-bottom:9px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe));z-index:300;
 background:var(--gold);color:var(--ink);padding:11px 18px;border-radius:999px;font-weight:700;font-size:13.5px;
 opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.warnbox{border-left:3px solid var(--warn);background:rgba(224,167,94,.1);padding:11px 13px;border-radius:0 var(--rs) var(--rs) 0;font-size:13px;color:var(--dim);margin-bottom:11px}
.warnbox b{color:var(--warn)}
.math{border-left:2px solid var(--gold);background:rgba(197,162,83,.07);border-radius:0 var(--rs) var(--rs) 0;padding:14px 16px;margin-top:16px;font-size:14px;color:var(--dim)}
.math b{color:var(--gold-lt)}
.math .big{display:block;color:var(--bone);font-size:17px;font-weight:700;margin-top:7px}
.bar2{height:7px;background:#0B1E38;border-radius:99px;overflow:hidden;margin-top:8px}
.slidewrap{position:relative;padding-bottom:20px}
.slidewrap input[type=range]{width:100%;accent-color:var(--gold);position:relative;z-index:2}
.smark{position:absolute;top:-2px;transform:translateX(-50%);pointer-events:none;z-index:1;text-align:center}
.smark i{display:block;width:2px;height:22px;background:var(--bone);margin:0 auto;opacity:.85;border-radius:2px}
.smark b{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone);
 white-space:nowrap;margin-top:1px;opacity:.85}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#8E6F2E,var(--gold));border-radius:99px}
.rec{display:flex;align-items:center;gap:10px}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--bad);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
</style>
</head>
<body>

<div id="boot">
  <svg class="bolt" viewBox="0 0 20 48"><defs><linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F0DDA8"/><stop offset="100%" stop-color="#A2803A"/></linearGradient></defs><path d="M15,2 L4,22 L10,22 L3,46 L17,20 L10,20 Z" fill="url(#lb)"/></svg>
  <h1>Striking Details</h1>
  <div class="spin" id="bootSpin"></div>
  <div class="msg" id="bootMsg">Opening your book…</div>
  <button class="btn ghost" id="bootRetry" style="max-width:240px;display:none">Try again</button>
</div>

<div id="app" class="hide">
  <header class="bar">
    <h2 id="ttl">Home</h2>
    <span class="sv idle" id="sv">saved</span>
    <span class="who" id="who">—</span>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg>Home</button>
    <button data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 20c0-2.4-1-4.5-2.6-5.7"/></svg>People</button>
    <button data-tab="money"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.6 7 6.5s2 2.8 5 3.5 5 1.6 5 3.5-2.2 3-5 3-5-1.1-5-3"/></svg>Money</button>
    <button data-tab="insights"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="in">
  <div class="top"><h3 id="shTtl">Edit</h3><button class="x" id="shX">&#10005;</button></div>
  <div class="bd2" id="shBd"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* =================== constants =================== */
var CATS=['Dealer lot','Residential','Business fleet','Marine','RV / coach','Referral partner'];
var STATUS=['New','Contacted','Quoted','Booked','Completed','Follow up','Dormant'];
var WEIGHT={'New':.1,'Contacted':.2,'Quoted':.4,'Booked':.9,'Follow up':.25,'Completed':0,'Dormant':0};
var SOURCES=['Met in person','Lot','Neighborhood','Referral','Website','Google','Repeat customer','Other'];
var EXPCATS=['Consumables','Supplies','Marketing','Fuel','Insurance','Software','Fees','Other'];
var VTYPES=['Car','Truck / SUV','Boat','RV / coach','Fleet vehicle'];
/* what he actually sells today, in the order he sells it. Ceramic and PPF are
   deliberately absent: he has not landed one yet, and quoting himself work he
   is not doing makes every projection a fantasy. Add them when they are real. */
var SERVICES=[['Reset Wash',75],['Express Hand Wash',75],['Wash & Seal',115],
 ['Interior Refresh',135],['The Full Reset',225],['Quick Detail',295]];
var GOAL_DEF={target:0,taxPct:25,daysPerWeek:5,weeksPerYear:50,costPct:null};
var BIZ={name:'Striking Details LLC',addr:'3560 SW Racquet Club Way',city:'Palm City, FL 34990',
 phone:'(561) 275-8846',web:'palmcityhandwash.com'};

var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s));};
function money(n){return '$'+(Math.round(n||0)).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'x'+Math.random().toString(36).slice(2,10);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return '';var p=String(s).slice(0,10).split('-');return p.length===3?p[1]+'/'+p[2]+'/'+p[0].slice(2):String(s);}
function daysTo(s){if(!s)return null;var a=new Date(String(s).slice(0,10)+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/86400000);}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2000);}

/* =================== server bridge =================== */
var DB={contacts:[],ledger:[],invoices:[],settings:{}}, USER='', PENDING=0, LASTERR=null;
function call(fn,args){
  return new Promise(function(res,rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args||[]);
  });
}
function svState(){
  var el=$('#sv'); if(!el)return;
  if(LASTERR){el.className='sv err';el.textContent='not saved — retry';}
  else if(PENDING>0){el.className='sv busy';el.textContent='saving…';}
  else {el.className='sv idle';el.textContent='saved';}
}
var RETRY=[];
function push(fn,args,label){
  PENDING++; LASTERR=null; svState();
  return call(fn,args).then(function(r){
    PENDING--; svState(); return r;
  }).catch(function(e){
    PENDING--; LASTERR=String(e&&e.message||e);
    RETRY.push({fn:fn,args:args,label:label});
    svState();
    return null;
  });
}
function retryAll(){
  if(!RETRY.length){LASTERR=null;svState();return;}
  var q=RETRY.slice(); RETRY=[];
  toast('Retrying '+q.length+'…');
  Promise.all(q.map(function(j){return push(j.fn,j.args,j.label);}))
    .then(function(){ if(!RETRY.length){LASTERR=null;svState();toast('Saved');} });
}
function saveRec(kind,rec){
  var arr=DB[kind], i=-1;
  for(var k=0;k<arr.length;k++) if(arr[k].id===rec.id){i=k;break;}
  if(i===-1)arr.push(rec); else arr[i]=rec;
  return push('saveRecord',[kind,rec],kind);
}
function delRec(kind,id){
  DB[kind]=DB[kind].filter(function(r){return r.id!==id;});
  return push('deleteRecord',[kind,id],kind);
}
function setSetting(k,v){ DB.settings[k]=v; return push('saveSetting',[k,v],'setting'); }

/* =================== accessors =================== */
function C(){return DB.contacts;}
function L(){return DB.ledger;}
function INV(){return DB.invoices;}
function findC(id){for(var i=0;i<C().length;i++)if(C()[i].id===id)return C()[i];return null;}
function findL(id){for(var i=0;i<L().length;i++)if(L()[i].id===id)return L()[i];return null;}
function findI(id){for(var i=0;i<INV().length;i++)if(INV()[i].id===id)return INV()[i];return null;}
function parseVeh(s){
  if(Array.isArray(s))return s;
  return String(s||'').split('|').filter(function(x){return x.trim();}).map(function(x){
    var m=x.trim().match(/^(.*?)(?:\s*\[(\d+)ft\])?(?:\s*\{(.*?)\})?$/);
    return {desc:(m[1]||'').trim(), len:m[2]||'', type:m[3]||'Car'};
  });
}
function joinVeh(a){
  return (a||[]).map(function(v){return (v.desc||v.type||'')+(v.len?' ['+v.len+'ft]':'')+' {'+(v.type||'Car')+'}';}).join(' | ');
}

/* =================== money =================== */
function sum(a){return a.reduce(function(t,x){return t+(+x.amount||0);},0);}
function inMonth(d){return String(d||'').slice(0,7)===today().slice(0,7);}
function cashIn(){return sum(L().filter(function(e){return e.kind==='capital'||(e.kind==='revenue'&&e.paid);}));}
function cashOut(){return sum(L().filter(function(e){return e.kind==='expense'||e.kind==='equipment';}));}
function cash(){return cashIn()-cashOut();}
function owed(){return sum(L().filter(function(e){return e.kind==='revenue'&&!e.paid;}));}
function revAll(){return sum(L().filter(function(e){return e.kind==='revenue';}));}
function revMTD(){return sum(L().filter(function(e){return e.kind==='revenue'&&inMonth(e.date);}));}
function expMTD(){return sum(L().filter(function(e){return e.kind==='expense'&&inMonth(e.date);}));}
function opEx(){return sum(L().filter(function(e){return e.kind==='expense';}));}
function equip(){return sum(L().filter(function(e){return e.kind==='equipment';}));}
function capital(){return sum(L().filter(function(e){return e.kind==='capital';}));}
function profit(){return revAll()-opEx();}
function forecast(){var t=0;C().forEach(function(c){if(+c.quoteAmount>0&&c.status!=='Completed'&&c.status!=='Dormant')t+=c.quoteAmount*(WEIGHT[c.status]||0);});return t;}
function pipeline(){var t=0;C().forEach(function(c){if(+c.quoteAmount>0&&c.status!=='Completed'&&c.status!=='Dormant')t+=+c.quoteAmount;});return t;}
function mrr(){var t=0;C().forEach(function(c){if(+c.planAmount>0&&c.status!=='Dormant')t+=+c.planAmount;});return t;}
function revToday(){return sum(L().filter(function(e){return e.kind==='revenue'&&String(e.date).slice(0,10)===today();}));}

/* goal */
function goal(){var g=DB.settings.goal||{},o={};for(var k in GOAL_DEF)o[k]=(g[k]===undefined||g[k]===null)?GOAL_DEF[k]:g[k];
  if(g.costPct!==undefined&&g.costPct!==null)o.costPct=g.costPct;return o;}
function costPctActual(){
  var r=revAll(),jobs=L().filter(function(e){return e.kind==='revenue';}).length;
  if(r<2000||jobs<5)return null;
  return Math.max(5,Math.min(60,Math.round(100*opEx()/r)));
}
function costPctUsed(){var g=goal();if(g.costPct!==null&&g.costPct!==undefined)return g.costPct;var a=costPctActual();return a===null?20:a;}
function goalMath(){
  var g=goal(),c=costPctUsed()/100,t=g.taxPct/100,keep=(1-c)*(1-t);
  var gross=(g.target>0&&keep>0)?g.target/keep:0,wks=g.weeksPerYear||50,dpw=g.daysPerWeek||5;
  return {target:g.target,taxPct:g.taxPct,costPct:Math.round(c*100),gross:gross,
    perMonth:gross/12,perWeek:gross/wks,perDay:gross/(wks*dpw),keepRate:keep,weeks:wks,days:dpw};
}
function daysLeftInYear(){var d=new Date(today()+'T00:00:00');return Math.max(0,Math.floor((new Date(d.getFullYear(),11,31)-d)/86400000)+1);}
function restOfYear(){var m=goalMath();if(!m.gross)return null;var f=daysLeftInYear()/365;
  return {days:daysLeftInYear(),takeHome:m.target*f,gross:m.gross*f,year:new Date(today()+'T00:00:00').getFullYear()};}
function firstLedgerDate(){var d=L().map(function(e){return String(e.date).slice(0,10);}).filter(Boolean).sort();return d.length?d[0]:null;}
function yearRevenue(){var y=today().slice(0,4);return sum(L().filter(function(e){return e.kind==='revenue'&&String(e.date).slice(0,4)===y;}));}
function yearPace(){
  var m=goalMath();if(!m.gross)return null;
  var f=firstLedgerDate();if(!f)return null;
  var days=Math.floor((new Date(today()+'T00:00:00')-new Date(f+'T00:00:00'))/86400000)+1;
  if(days<14)return null;
  var expected=m.gross*(days/365),got=yearRevenue();
  return {expected:expected,got:got,diff:got-expected,days:days,pct:expected>0?Math.round(100*got/expected):0};
}
/* insights */
function jobVehicles(e){
  if(+e.vehicles>0)return +e.vehicles;
  var m=/SD-\d+/.exec(e.memo||'');
  if(m){var iv=INV().filter(function(x){return x.no===m[0];})[0];
    if(iv){var it=invItems(iv);if(it.length)return it.length;}}
  var c=findC(e.contactId);
  if(c){var vs=parseVeh(c.vehicles);if(vs.length)return vs.length;}
  return 1;
}
function jobStats(){
  var jobs=L().filter(function(e){return e.kind==='revenue';});
  var n=jobs.length,rev=sum(jobs);
  var withHrs=jobs.filter(function(e){return +e.hours>0;});
  var hrs=jobs.reduce(function(t,e){return t+(+e.hours||0);},0);
  var cars=0;jobs.forEach(function(e){cars+=jobVehicles(e);});
  var months={};L().filter(function(e){return e.kind==='expense';}).forEach(function(e){
    var k=String(e.date).slice(0,7);months[k]=(months[k]||0)+(+e.amount||0);});
  var mk=Object.keys(months);
  var supplies=sum(L().filter(function(e){return e.kind==='expense'&&/suppl|consum/i.test(e.cat||'');}));
  return {jobs:n,rev:rev,avgJob:n?rev/n:0,hours:hrs,hourly:hrs>0?sum(withHrs)/hrs:null,
    jobsWithHours:withHrs.length,cars:cars,perCar:cars?rev/cars:0,
    monthlySpend:mk.length?mk.reduce(function(t,k){return t+months[k];},0)/mk.length:0,
    months:mk.length,supplies:supplies,suppliesPerCar:cars?supplies/cars:0};
}
/* what-if: move the price and the volume, watch the year change */
function medianPerCar(){
  // needs a real spread of jobs before it means anything; two jobs and one ceramic
  // reads as a $1,035 car, which is nonsense to open a planning slider on
  var v=L().filter(function(e){return e.kind==='revenue'&&(+e.amount>0);})
    .map(function(e){return (+e.amount)/Math.max(1,jobVehicles(e));}).sort(function(a,b){return a-b;});
  if(v.length<5)return 0;
  var i=Math.floor(v.length/2);
  return v.length%2 ? v[i] : (v[i-1]+v[i])/2;
}
function avgPerCar(cat){
  var jobs=L().filter(function(e){
    if(e.kind!=='revenue'||!(+e.amount>0))return false;
    if(!cat)return true;
    var c=findC(e.contactId);
    return !!c && c.category===cat;
  });
  var rev=0,cars=0;
  jobs.forEach(function(e){rev+=+e.amount;cars+=jobVehicles(e);});
  return {n:jobs.length, cars:cars, avg: cars?rev/cars:0};
}
function segsWithWork(){
  var out=[];
  CATS.forEach(function(c){ var a=avgPerCar(c); if(a.n)out.push([c,a]); });
  return out;
}
function whatIf(){
  var st=jobStats(), m=goalMath();
  // the slider opens on the same number the marker shows, otherwise picking a
  // customer type moves the mark but not the handle and the card contradicts itself
  var seg=avgPerCar(WI.seg||'');
  var avg = seg.n>=1 ? Math.round(seg.avg) : 100;   // any real job beats a guess
  if(avg>600)avg=600; if(avg<40)avg=40;
  var cars = WI.cars!==null ? WI.cars : 5;
  var price = WI.price!==null ? WI.price : avg;
  var perDay = price*cars;
  var wks=m.weeks||50, dpw=m.days||5;
  var year = perDay*dpw*wks;
  var keep = (1-costPctUsed()/100)*(1-(goal().taxPct||0)/100);
  var take = year*keep;
  var need = m.perDay>0 ? m.perDay/price : null;      // cars a day to hit the target
  return {avg:avg,price:price,cars:cars,perDay:perDay,year:year,take:take,
          need:need,target:m.target,perDayTarget:m.perDay,keep:keep};
}

/* the honest picture: what the work actually pays, against what the goal needs */
function reality(){
  var st=jobStats(), m=goalMath();
  if(!st.hours||!st.hourly) return null;
  var jobs=L().filter(function(e){return e.kind==='revenue'&&+e.hours>0;});
  var rated=jobs.map(function(e){return {memo:e.memo||e.cat||'Job',rate:(+e.amount||0)/(+e.hours||1),
    amount:+e.amount||0,hours:+e.hours||0,cars:jobVehicles(e)};}).sort(function(a,b){return b.rate-a.rate;});
  var hoursForDay = m.perDay>0 ? m.perDay/st.hourly : null;
  var dayLen = 8;
  return {hourly:st.hourly, best:rated[0], worst:rated[rated.length-1], n:rated.length,
    hoursForDay:hoursForDay, realistic: hoursForDay!==null && hoursForDay<=dayLen,
    perDay:m.perDay, dayLen:dayLen,
    rateNeeded: m.perDay>0 ? m.perDay/dayLen : null};
}

     +'<div class="muted" style="margin:7px 0 12px">Set what you want to take home and this works back to a daily number.</div>'
     +'<button class="btn" id="goalSet">Set my target</button></div>';
  var p=yearPace();
  var chip=p?'<span class="pill '+(p.diff>=0?'ok':'bad')+'">'+(p.diff>=0?'ahead ':'behind ')+money(Math.abs(p.diff))+'</span>':'';
  var h='<div class="card"><div style="display:flex;align-items:baseline;gap:8px">'
   +'<div class="lab" style="flex:1">Take home '+money(m.target)+' a year</div>'+chip+'</div>'
   +'<div class="row3" style="margin-top:11px">'
   +kv('Per day',money(m.perDay))+kv('Per week',money(m.perWeek))+kv('Per month',money(m.perMonth))+'</div>'
   +'<div class="muted" style="margin-top:10px">That is <b style="color:var(--gold-lt)">'+money(m.gross)+'</b> invoiced over a full year, after '
   +m.costPct+'% supplies and '+m.taxPct+'% tax. You keep about '+Math.round(m.keepRate*100)+' cents on the dollar.</div>';
  var ro=restOfYear();
  if(ro&&ro.days<330)
    h+='<div class="math"><b>Rest of '+ro.year+', '+ro.days+' days left</b>'
     +'<span class="big">'+money(ro.takeHome)+' to take home &middot; '+money(ro.gross)+' invoiced</span></div>';
  var a=m.perDay/75,b=m.perDay/100;
  h+='<div style="margin-top:13px;padding-top:11px;border-top:1px solid rgba(255,255,255,.08)">'
   +'<div class="lab" style="margin-bottom:8px">What that is in cars</div>'
   +'<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px"><span>Washes at $75</span>'
   +'<span style="color:var(--gold-lt);font-weight:700">'+(Math.round(a*10)/10)+' a day &middot; '+Math.round(a*m.days)+' a week</span></div>'
   +'<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px"><span>Washes at $100</span>'
   +'<span style="color:var(--gold-lt);font-weight:700">'+(Math.round(b*10)/10)+' a day &middot; '+Math.round(b*m.days)+' a week</span></div>'
   +bigJobLine(m)+'</div>';
  h+=(p?'<div class="muted" style="margin-top:11px">Billed '+money(p.got)+' in '+p.days+' days against '+money(p.expected)+' to be on pace.</div>'
       :'<div class="muted" style="margin-top:11px">Pace starts after a couple of weeks of jobs.</div>');
  h+='<div style="height:11px"></div><button class="btn ghost sm" id="goalSet">Adjust</button></div>';
  return h;
}
</script>
<?!= include('Forms'); ?>
